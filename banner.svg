<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8F3"/>
      <stop offset="100%" stop-color="#FDEEF4"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#F3D7E4" stroke-width="1"/>
    </pattern>
    <pattern id="gridBold" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#EFC3D8" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="900" height="220" rx="18" fill="url(#bg)"/>
  <rect width="900" height="220" rx="18" fill="url(#grid)"/>
  <rect width="900" height="220" rx="18" fill="url(#gridBold)"/>
  <rect x="1" y="1" width="898" height="218" rx="17" fill="none" stroke="#F4A9C6" stroke-width="2"/>

  <!-- washi tape corners -->
  <rect x="-10" y="10" width="90" height="26" fill="#FBD5E0" opacity="0.85" transform="rotate(-8 30 20)"/>
  <rect x="820" y="180" width="90" height="26" fill="#C9E4DE" opacity="0.85" transform="rotate(-8 860 190)"/>

  <!-- doodle: bunny ears silhouette -->
  <g transform="translate(760,40)" opacity="0.9">
    <ellipse cx="10" cy="10" rx="7" ry="20" fill="#FADDE7" stroke="#F0A8C4" stroke-width="1.5" transform="rotate(-12 10 10)"/>
    <ellipse cx="34" cy="10" rx="7" ry="20" fill="#FADDE7" stroke="#F0A8C4" stroke-width="1.5" transform="rotate(10 34 10)"/>
    <circle cx="22" cy="42" r="16" fill="#FFF" stroke="#F0A8C4" stroke-width="1.5"/>
    <circle cx="16" cy="40" r="1.6" fill="#6B4F4F"/>
    <circle cx="28" cy="40" r="1.6" fill="#6B4F4F"/>
    <path d="M18 46 Q22 49 26 46" stroke="#D98CAE" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- doodle: sparkles + star -->
  <g fill="#F4B8D4">
    <path d="M60 170 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/>
    <path d="M120 45 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"/>
  </g>
  <g fill="#B8D8D0">
    <path d="M820 100 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z"/>
  </g>

  <!-- doodle: coffee cup -->
  <g transform="translate(55,55)" opacity="0.9">
    <path d="M0 10 h34 v18 a17 17 0 0 1 -34 0 z" fill="#FFF" stroke="#D9A6C2" stroke-width="1.6"/>
    <path d="M34 14 h8 a7 7 0 0 1 0 14 h-6" fill="none" stroke="#D9A6C2" stroke-width="1.6"/>
    <path d="M6 4 q3 -6 0 -10 M16 4 q3 -6 0 -10 M26 4 q3 -6 0 -10" stroke="#D9A6C2" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- pin / paperclip -->
  <g transform="translate(400,18) rotate(8)" opacity="0.85">
    <rect x="0" y="0" width="10" height="34" rx="5" fill="none" stroke="#C9A3D6" stroke-width="2.4"/>
    <rect x="2" y="6" width="6" height="22" rx="3" fill="none" stroke="#C9A3D6" stroke-width="2"/>
  </g>

  <!-- name -->
  <text x="450" y="118" text-anchor="middle" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" font-size="52" fill="#5A4444" font-weight="bold">bhavika ✿</text>
  <text x="450" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#9A6C82" letter-spacing="1.5">COMPUTER SCIENCE · MIT MANIPAL</text>

  <!-- little underline squiggle -->
  <path d="M330 162 q30 12 60 0 t60 0 t60 0" stroke="#F0A8C4" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
